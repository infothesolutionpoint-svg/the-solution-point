<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | The Solution Point</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: #faf9f6;
        }

        .admin-login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border: 1px solid var(--line);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .admin-login-box h1 {
            margin-bottom: 8px;
            color: var(--navy);
            font-family: "Playfair Display", serif;
        }

        .admin-login-box p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        .login-field {
            margin-bottom: 18px;
        }

        .login-field label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
            color: var(--navy);
        }

        .login-field input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9dfe1;
            border-radius: 7px;
            font: inherit;
            box-sizing: border-box;
        }

        .login-field input:focus {
            outline: none;
            border-color: #b8894e;
        }

        .login-button {
            width: 100%;
            border: 0;
            cursor: pointer;
        }

        .login-error {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            background: #fff1f1;
            color: #a33;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="admin-login-page">

        <div class="admin-login-box">

            <span class="eyebrow">
                ADMIN PANEL
            </span>

            <h1>
                Admin Login
            </h1>

            <p>
                Sign in to manage The Solution Point.
            </p>

            <form id="adminLoginForm">

                <div class="login-field">

                    <label for="adminEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Admin email"
                        required
                    >

                </div>

                <div class="login-field">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    Login
                </button>

                <div
                    class="login-error"
                    id="loginError"
                >
                    Invalid email or password.
                </div>

            </form>

        </div>

    </main>

</body>
<script>

document
    .getElementById("adminLoginForm")
    .addEventListener("submit", async function (event) {

        event.preventDefault();

        const email =
            document
                .getElementById("adminEmail")
                .value
                .trim();

        const password =
            document
                .getElementById("adminPassword")
                .value;

        const error =
            document.getElementById("loginError");

        error.style.display = "none";

        try {

            const response = await fetch(
                "/api/admin-login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const data =
                await response.json();

            if (
                response.ok &&
                data.success
            ) {

                sessionStorage.setItem(
                    "tsp_admin_logged_in",
                    "true"
                );

                window.location.href =
                    "admin.html";

            } else {

                error.style.display =
                    "block";

                error.textContent =
                    data.message ||
                    "Invalid email or password.";

            }

        } catch (loginError) {

            console.error(
                "Login Error:",
                loginError
            );

            error.style.display =
                "block";

            error.textContent =
                "Unable to connect to the login server.";

        }

    });

</script>''
</html>
